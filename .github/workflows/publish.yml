# Publish the crates to crates.io when a version tag (v0.1.0, v0.2.0-rc.1, ...) is pushed.
#
#   tag vX.Y.Z ──▶ tag == workspace version? ──▶ Metal toolchain ──▶ cargo publish --workspace
#                       no: fail                                      (dependency order; builds
#                                                                      each crate first; skips
#                                                                      ironbark-ffi)
#
# Needs the repo secret CARGO_REGISTRY_TOKEN (crates.io API token, scope: publish-new + publish-update).
name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # MLX needs Apple Silicon and the Metal compiler.
    runs-on: macos-26
    # The verify builds compile MLX from source.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && cargo --version

      - name: Tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ironbark") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

      - name: Metal toolchain
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
