[workspace]
resolver = "3"
members = [
    "crates/ironbark",
    "crates/ironbark-cli",
    "crates/ironbark-engine",
    "crates/ironbark-experts",
    "crates/ironbark-fetch",
    "crates/ironbark-ffi",
    "crates/ironbark-mlx",
    "crates/ironbark-mlx-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/russellwmy/ironbark"
readme = "README.md"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Numeric kernels cast between usize / f32 / f64 by design.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Math code uses short names (x, w, l, e, h, f).
many_single_char_names = "allow"
similar_names = "allow"
# Restriction lints picked one by one
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "warn"
rc_mutex = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"

[workspace.dependencies]
ironbark = { version = "0.1.0", path = "crates/ironbark" }
ironbark-experts = { version = "0.1.0", path = "crates/ironbark-experts" }
ironbark-fetch = { version = "0.1.0", path = "crates/ironbark-fetch" }
ironbark-engine = { version = "0.1.0", path = "crates/ironbark-engine" }
ironbark-mlx = { version = "0.1.0", path = "crates/ironbark-mlx" }
ironbark-mlx-sys = { version = "0.1.0", path = "crates/ironbark-mlx-sys" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
debug = false

