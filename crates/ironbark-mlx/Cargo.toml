[package]
name = "ironbark-mlx"
description = "Safe Rust API over MLX for inference on Apple silicon: arrays, ops, fused kernels, eval and compile"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["mlx", "metal", "apple-silicon", "machine-learning"]
categories = ["science"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-ios-sim"]

[features]
default = ["accelerate", "metal"]
accelerate = ["ironbark-mlx-sys/accelerate"]
metal = ["ironbark-mlx-sys/metal"]
# Conversion between `Array` and `safetensors::TensorView`
safetensors = ["dep:safetensors", "dep:bytemuck"]

[dependencies]
ironbark-mlx-sys.workspace = true
bytemuck = { version = "1", features = ["extern_crate_std"], optional = true }
half.workspace = true
libc.workspace = true
mach-sys = "0.5"
num-complex = "0.4"
num-traits = "0.2"
num_enum = "0.7"
paste = "1"
safetensors = { version = "0.8", optional = true }
smallvec = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
float_eq = "1"
pretty_assertions = "1.4.0"
tempfile = "3"
